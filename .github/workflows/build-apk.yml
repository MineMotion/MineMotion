name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dev:
        description: Build APK that loads the Vite dev server at localhost:5173
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install
      - run: npm run build
      - name: Dev server config
        if: ${{ inputs.dev }}
        run: |
          jq '.server = {url: "http://localhost:5173", cleartext: true}' capacitor.config.json > cap.tmp
          mv cap.tmp capacitor.config.json

      - run: npx cap add android

      - name: Apply native customizations
        run: |
          cp -r resources/res/. android/app/src/main/res/
          cp resources/MainActivity.java android/app/src/main/java/com/minemotion/app/MainActivity.java
          bash resources/patch-manifest.sh
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MineMotion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MineMotion-apk
          path: MineMotion.apk

      - if: ${{ !inputs.dev }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MineMotion build ${{ github.run_number }}
          files: MineMotion.apk
